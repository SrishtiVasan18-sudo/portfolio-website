 */const nw=Dt("X",[["path",{d:"M18 6 6 18",key:"1bl5f8"}],["path",{d:"m6 6 12 12",key:"d8bk6v"}]]),ke={name:"Srishti Vasan",title:"Healthcare Coordinator",subtitle:"Patient Navigation · Care Coordination · PBSC Donor Pathways",tagline:"Hands-on healthcare coordination across PBSC donor pathways, community-health response, blood-resource coordination, and hospital operations — supporting people through anxious, time-sensitive moments.",email:"mudliarsenthil612@gmail.com",linkedin:"https://linkedin.com/in/srishti-vasan",location:"Bengaluru, India · Open to Remote",stats:[{value:125,suffix:"",label:"CT-stage PBSC donor cases"},{value:1e4,suffix:"+",label:"Community-health & blood-support cases"},{value:800,suffix:"K",label:"Cumulative crisis-response cases"},{value:65,suffix:"",label:"Phlebotomy requests handled"}],profile:"Healthcare coordinator with hands-on experience in PBSC donor pathways, community-health response, blood-resource coordination, and hospital operations. Comfortable working with people who are anxious, distressed, or navigating time-sensitive healthcare needs. Experienced in case follow-up, confidential documentation, resource navigation, informed-consent support, multidisciplinary coordination, and escalation. Looking to bring this background to remote patient navigation, advocacy, and care-coordination teams.",experience:[{role:"CT Associate — PBSC Donor Coordination",org:"DKMS Foundation India",location:"Bengaluru",period:"2025 – Aug 2026",bullets:["Managed approximately 125 CT-stage PBSC donor cases during tenure, coordinating donor readiness, documentation, follow-up, and escalation through the confirmatory-typing pathway.","Handled 65 phlebotomy requests linked to closed CT cases using DKMS's proprietary case-management workflow.","Spoke with potential donors by phone and video, helping them understand next steps, supporting informed consent and readiness, and coordinating transition to clinical teams.","Worked across donors, registry colleagues, and medical teams while maintaining confidential records and time-sensitive case updates."]},{role:"Social Worker & Program Coordinator",org:"Life Savers Association",location:"Bengaluru",period:"Apr 2021 – Aug 2025",bullets:["Personally handled approximately 5,000–10,000 community-health and blood-support cases during tenure, including urgent requests requiring donor/resource coordination and follow-through.","Helped people navigate hospital, blood, and other healthcare-resource needs while coordinating with medical professionals, NGOs, volunteers, and government stakeholders.","Supported distressed families and difficult cases where clear communication, quick coordination, and escalation were essential.","Provided informal peer and volunteer guidance and contributed to blood-donor outreach, health-awareness, end-of-life-care, and social-welfare work across Karnataka."]},{role:"Community Health & COVID Response Volunteer",org:"Multiple NGO Initiatives",location:"Pan India",period:"Mar 2020 – Sep 2024",bullets:["Personally handled approximately 800,000 cumulative community-health and crisis-response cases across multiple NGO initiatives over the course of the engagement.","Connected people with credible health information and care resources and supported high-volume COVID response and inter-agency coordination.","Worked across Every Infant Matters, COVID Task Force, COVID Citizens Initiative, and other community-service initiatives; received recognition for public-health and community-service contributions."]},{role:"Emergency Medical Coordinator — Blood Donation Initiative",org:"St. John's Hospital",location:"Bengaluru",period:"Apr 2025",bullets:["Coordinated an emergency blood-donation initiative that produced 11 eligible, screened donors within one operational day.","Managed registration, screening coordination, logistics, follow-up, and hospital handoff."]},{role:"Clinical Management Intern",org:"Deepashri Multi-Specialty Hospital — Neuro & Rehabilitation",location:"Bengaluru",period:"Apr 2025",bullets:["Supported inpatient and outpatient workflows with exposure to admissions, ICU processes, bed management, care escalation, and interdepartmental coordination.","Prepared clinical observations and departmental reports."]}],caseStudies:[{number:"01",title:"Complex Pediatric Care Coordination & Government Liaison",context:"AIIMS, New Delhi | August 2021",focus:["Multidisciplinary Coordination","Government Liaison","International Medication Access","Patient Advocacy"],overview:["During the COVID-19 pandemic in August 2021, I was involved in coordinating a highly complex pediatric case concerning conjoined twins with serious cardiac complications. Both parents were medical professionals, including a pediatric surgeon based in Lucknow, India.","Due to the complexity and urgency of the situation, a multidisciplinary team comprising approximately 15 medical specialists and a small group of medical social workers, including myself, was brought together at AIIMS, New Delhi."],challenge:["One of the significant challenges was securing Zolgensma, a specialized medication that needed to be sourced from Europe before the planned medical intervention.","The case required coordination across multiple institutions and stakeholders during a period when healthcare resources, transportation, and administrative processes were under considerable pressure."],contributions:["Coordinated communication between the medical team, the children's family, social workers, and external stakeholders.","Worked alongside the Ministry of Health and Family Welfare, Government of India, to support the necessary arrangements.","Communicated directly with India's Health Minister regarding the case and the challenges involved.","Supported coordination of the children's transportation and admission to AIIMS, New Delhi.","Followed up on the arrangements required to facilitate access to the medication from Europe.","Maintained communication across the multidisciplinary team to support timely decisions and escalation of urgent matters."],outcome:["Following extensive collaborative efforts, the medication was successfully brought to India, and the planned surgical intervention was completed successfully. Both children survived.","The case demonstrated the importance of coordinated action across healthcare institutions, government authorities, medical professionals, and patient-support teams."],reflection:["This experience strengthened my ability to navigate complex healthcare systems, communicate across different levels of responsibility, and remain organized under significant pressure.","It reinforced my belief that effective patient advocacy requires more than compassion. It requires persistence, accountability, and the willingness to follow through when patients and families are depending on coordinated support."]},{number:"02",title:"Palliative Care Coordination & Family Support",context:"Hospital & Palliative Care Agency Collaboration | 2024",focus:["Patient Advocacy","Psychosocial Support","Family Counselling","Multidisciplinary Care Coordination"],overview:["In 2024, I supported a patient who had been hospitalized following a stroke and required ongoing palliative care involvement.","The patient's condition created considerable emotional uncertainty for both the individual and their family. Alongside medical care, the family needed consistent communication, emotional support, and assistance navigating difficult conversations about the patient's ongoing care."],challenge:["The primary challenge was ensuring that the patient and family received coordinated, compassionate support while multiple healthcare teams were involved.","The family was dealing with uncertainty about the patient's condition, while the hospital and palliative care agency were responsible for different aspects of care.","Maintaining communication between everyone involved was essential."],contributions:["Provided ongoing emotional and counselling support to the patient and family.","Acted as a communication link between the family, hospital professionals, and palliative care agency.","Helped the family express concerns and communicate questions to the treating medical team.","Supported discussions surrounding ongoing care and the patient's needs.","Collaborated with healthcare professionals to maintain continuity of support.","Advocated for the patient's comfort, dignity, and preferences throughout the care process."],outcome:["The collaborative approach helped maintain communication between the family, hospital team, and palliative care agency, supporting a more coordinated and compassionate care experience.","Although the patient's medical condition remained outside my control, my contribution focused on helping the family feel informed, supported, and included in discussions about care."],reflection:["This case shaped my understanding of what meaningful patient advocacy looks like.","Not every healthcare challenge has a straightforward solution. Sometimes, the most important contribution is helping patients and families understand their options, express their concerns, and feel supported during deeply uncertain circumstances.","It strengthened my commitment to combining practical coordination with empathy, patience, and respect for patient dignity."]},{number:"03",title:"Emergency Blood Donor Mobilization & Hospital Coordination",context:"St. John's Hospital, Bengaluru | 2025",focus:["Emergency Response","Blood Donor Coordination","Stakeholder Communication","Healthcare Operations"],overview:["In 2025, St. John's Hospital in Bengaluru faced an urgent requirement for blood donors and contacted multiple non-governmental organizations for assistance, including LSA.","I was assigned responsibility for coordinating LSA's response to the hospital's request.","Given the time-sensitive nature of the situation, immediate donor mobilization, consistent communication, and effective follow-up were essential."],challenge:["The primary challenge was identifying and coordinating available blood donors within a limited timeframe.","This required managing multiple donor communications simultaneously, confirming availability, and coordinating with the hospital to support its urgent requirements."],contributions:["Took ownership of the urgent donor coordination request.","Mobilized potential donors through outreach and follow-up.","Coordinated communication between prospective donors and the hospital.","Managed multiple donor responses and availability updates.","Prioritized urgent requirements and maintained consistent follow-through.","Worked to minimize avoidable delays in the donor coordination process."],outcome:["11 blood donors successfully coordinated within 24 hours.","Through focused outreach, coordination, and persistent follow-up, I successfully arranged 11 blood donors in a single day to support the hospital's urgent requirement.","In recognition of my contribution, St. John's Hospital issued me a formal letter of appreciation.","Recognition: Letter of Appreciation — St. John's Hospital, Bengaluru (2025)"],reflection:["This case demonstrated the value of taking ownership during urgent healthcare situations.","It reinforced my ability to manage competing priorities, communicate effectively, and coordinate resources under pressure.","More importantly, it reminded me that even a relatively short period of focused coordination can make a meaningful difference when healthcare teams are facing urgent resource requirements."]}],skills:["Patient & donor navigation","Care coordination","Healthcare resource navigation","Case follow-up","Confidential documentation","Informed-consent support","Blood-resource coordination","Escalation","Distressed family support","Multidisciplinary communication","Remote collaboration","Medical terminology"],education:[{title:"BBA — Human Resource Management & Logistics",org:"Acharya Institute of Graduate Studies, Bengaluru",year:"Aug 2025"},{title:"Trans
